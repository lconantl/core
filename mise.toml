monorepo_root = true

[env]
_.source = "{{ config_root }}/mise-env/docker.sh"

[monorepo]
config_roots = [
    "lib",
    "modules/*",
]

[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
protoc = "36.2"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
"go:github.com/kazhuravlev/options-gen/cmd/options-gen" = "v0.58.0"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "v2.8.0"
python = "3.13"

[tasks.all]
description = "Сгенерировать код, обновить зависимости, собрать, протестировать и прогнать линтер по каждому модулю последовательно"
run = '''
MISE_JOBS=1 mise run //lib/...:all
MISE_JOBS=1 mise run //modules/...:all
'''

[tasks.local-up]
description = "Собрать модули локально и запустить полное локальное окружение"
run = "python3 mise-tasks/local-env up"

[tasks.local-down]
description = "Остановить локальное окружение, сохранив тома с данными"
run = "python3 mise-tasks/local-env down"

[tasks.local-status]
description = "Показать статус запущенных контейнеров"
run = "python3 mise-tasks/local-env ps"

[tasks.local-config]
description = "Показать итоговую объединённую конфигурацию Compose"
run = "python3 mise-tasks/local-env config"

[tasks.local-logs]
description = "Показать логи всех контейнеров"
run = "python3 mise-tasks/local-env logs"