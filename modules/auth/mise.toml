[tasks.all]
description = "Полный цикл: генерация, зависимости, сборка, unit-тесты, интеграционные тесты, линт"
run = [
    { task = "generate" },
    { task = "modules" },
    { task = "build" },
    { task = "test" },
    { task = "integration-tests" },
    { task = "lint" },
]

[tasks.generate]
description = "Сгенерировать Go-код из всех контрактов (protobuf + OpenAPI + go generate)"
run = [
    { task = "grpc-generate" },
    { task = "oapi-generate" },
    { task = "go-generate" },
]

[tasks.go-generate]
description = "Запустить go generate по всем пакетам модуля"
run = "go generate ./..."

[tasks.grpc-generate]
description = "Сгенерировать Go-код из protobuf-контрактов (.proto)"
run = """
#!/usr/bin/env sh
set -eu

find . -name '*.proto' | while read -r proto_file; do
    proto_dir=$(dirname "$proto_file")
    protoc \
        --proto_path="$proto_dir" \
        --go_out="$proto_dir" \
        --go_opt=paths=source_relative \
        --go-grpc_out="$proto_dir" \
        --go-grpc_opt=paths=source_relative \
        "$proto_file"
done
"""

[tasks.oapi-generate]
description = "Сгенерировать Go-код из OpenAPI-контракта (.oapi.yaml)"
run = """
#!/usr/bin/env sh
set -eu

find . -name '*.oapi.yaml' | while read -r oapi_file; do
    base_filename="${oapi_file%.*}"
    oapi-codegen \
        -generate types,chi-server,strict-server,client,spec \
        -o "$base_filename.gen.go" "$oapi_file"
done
"""

[tasks."modules"]
description = "Привести зависимости модуля в порядок (go mod tidy)"
run = "go mod tidy"

[tasks.build]
description = "Сгенерировать контракты и собрать Linux-бинарник в dist/auth"
depends = ["generate"]
env = { GOOS = "linux", CGO_ENABLED = "0" }
run = "go build -v -trimpath -o dist/auth ./cmd"

[tasks."test"]
description = "Запустить unit-тесты (без integration-tests)"
run = '''
#!/usr/bin/env sh
set -eu

packages=$(go list ./...)
printf '%s\n' "$packages" | awk '!/\/internal\/integration-tests($|\/)/' | xargs go test
'''

[tasks."lint"]
description = "Запустить golangci-lint"
run = "golangci-lint run"

[tasks.integration-tests]
description = "Собрать Docker-образ и запустить интеграционные тесты (testcontainers)"
depends = ["build"]
run = [
    "docker build --tag distributed-programming-auth:integration .",
    "go test -v -count=1 ./internal/integration-tests",
]